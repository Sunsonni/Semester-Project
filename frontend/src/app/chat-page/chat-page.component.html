<div class="container py-4">
  <!-- Chat Window -->
  <div class="card shadow-sm" style="height: 75vh;">
    <div class="card-body d-flex flex-column overflow-auto">

      <!-- Chat Messages -->
      <div #chatContainer class="flex-grow-1 overflow-auto pe-2" style="max-height: 100%;">
        <div *ngFor="let msg of chatHistory()">
          
          <!-- USER MESSAGE -->
          <div *ngIf="msg.role === 'user'" class="d-flex justify-content-end mb-3">
            <div class="p-3 bg-primary text-white rounded-3" style="max-width: 75%;">
              {{ msg.content }}
            </div>
          </div>

          <!-- ASSISTANT MESSAGE -->
          <div *ngIf="msg.role === 'assistant'" class="d-flex justify-content-start mb-3">
            <div class="p-3 bg-light border rounded-3" style="max-width: 75%;">
              {{ msg.content }}
            </div>
          </div>

        </div>
      </div>

      <!-- Chat Input -->
      Chat Input
       <form [formGroup]="form" (ngSubmit)="sendMessage()" class="mt-3 position-relative">
        <textarea
          class="form-control pe-5" 
          placeholder="Type your message..."
          formControlName="input"
          name="msg"
          rows="1"
          style="resize: none; overflow:hidden; height: 40px;"
          (input)="autoResize($event)"
        ></textarea>

        <!-- Send button inside textarea box -->
        <button 
          type="submit" 
          class="btn btn-primary position-absolute"
          style="right: 5px; bottom: 5px; border-radius: 0.5rem; height: 30px; padding: 0 12px;"
        >
          Send
        </button>
      </form>

    </div>
  </div>
</div>


<app-modal
    [(shown)]="modalVisible"
    title="No API Key detected"
    [message]="modalMessage"
    [allowClose]="false"
></app-modal>

<app-new-chat-modal
    [(shown)]="newChatModalVisible"
    (confirmed)="onChatConfirmed($event)"
></app-new-chat-modal>
