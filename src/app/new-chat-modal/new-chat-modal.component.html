<div class="modal-header">
  <h5 class="modal-title">Create New Chat</h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <div *ngIf="showWarning" class="alert alert-danger d-flex justify-content-between align-items-center" role="alert">
  <div>
    <strong>Cancel </strong>will take you back to the home page.
  </div>
</div>
    <form [formGroup]="form">
        <!-- Bot Flavor Selection -->
        <label class="form-label">Select Bot Flavor</label>
        <select formControlName="flavor" class="form-select">
            <option value="default">Default</option>
            <option value="corporate">Corporate</option>
            <option value="influencer">Influencer</option>
            <option value="conspiracy">Conspiracy</option>
        </select>

        <!-- Chat Title -->
        <label class="form-label mt-3">Chat Title</label>
        <input class="form-control" placeholder="e.g., Homework Help" formControlName="title" />
                
    </form>
</div>

  
<div class="modal-footer">
  <button class="btn btn-secondary" (click)="close()">Cancel</button>
  <button class="btn btn-primary" (click)="confirm()">Create Chat</button>
</div>
