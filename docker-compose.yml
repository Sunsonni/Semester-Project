services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: teacher_user
      POSTGRES_PASSWORD: teacher_user
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql //inital init.sql file
      - ./db/project.sql:/docker-entrypoint-initdb.d/project.sql

  backend:
    build: ./backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "4200:80"   # your Nginx/Apache serving Angular dist folder
    depends_on:
      - backend

volumes:
  db_data:
